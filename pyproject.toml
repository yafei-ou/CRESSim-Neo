[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "cressim-neo"
version = "0.1.0"
description = "GPU-accelerated surgical simulation engine with Python bindings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch"]
gymnasium = ["gymnasium"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []
install.components = ["Python"]

[tool.scikit-build.cmake.define]
CRESSIM_NEO_BUILD_PYTHON = true
CRESSIM_NEO_BUILD_VIEWER = false
CRESSIM_NEO_BUILD_EXAMPLES = false
BUILD_TESTING = false
CRESSIM_NEO_ENABLE_CUDA_INTEROP = false
CRESSIM_NEO_ENABLE_ULTRASOUND = false
