# Single source of truth for the first managed Linux CUDA release lane.
[cuda]
lane = "cu126"
toolkit = "12.6.3"
runtime_major = 12
minimum_runtime = 12060

[python]
abis = ["cp310", "cp311", "cp312", "cp313"]

[pytorch]
version = "2.6.0"
index_url = "https://download.pytorch.org/whl/cu126"

[nvidia]
cuda_runtime = "12.6.77"
cufft = "11.3.0.4"
curand = "10.3.7.77"
nvjitlink = "12.6.85"

[distribution]
github_releases_url = "https://github.com/yafei-ou/CRESSim-Neo/releases"
ubuntu_minimum = "22.04"
manylinux = "manylinux_2_34"
