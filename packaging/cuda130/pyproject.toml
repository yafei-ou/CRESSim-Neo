[build-system]
requires = ["scikit-build-core>=0.10", "pybind11-stubgen>=2.5"]
build-backend = "scikit_build_core.build"

[project]
name = "cressim-neo"
version = "0.1.0+cu130"
description = "GPU-accelerated surgical simulation engine with Python bindings (CUDA 13.0)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # Match PyTorch cu130's exact CUDA runtime bundle. Its selected extras
    # provide the CUDART, CUFFT, CURAND, and NVJITLINK libraries we preload.
    "cuda-toolkit[cudart,cufft,curand,nvjitlink]==13.0.3; platform_system == 'Linux'",
]

[project.optional-dependencies]
gymnasium = ["gymnasium"]

[tool.scikit-build]
cmake.source-dir = "../.."
cmake.build-type = "Release"
wheel.packages = []
install.components = ["Python"]

[tool.scikit-build.cmake.define]
CRESSIM_NEO_BUILD_PYTHON = true
CRESSIM_NEO_BUILD_VIEWER = true
CRESSIM_NEO_BUILD_EXAMPLES = false
BUILD_TESTING = false
CRESSIM_NEO_ENABLE_CUDA_INTEROP = true
CRESSIM_NEO_ENABLE_ULTRASOUND = true
CRESSIM_NEO_REQUIRE_PYTHON_STUBS = true
CRESSIM_NEO_CUDA_RUNTIME_PROVIDER = "MANAGED"
CRESSIM_NEO_MANAGED_CUDA_TOOLKIT_VERSION = "13.0"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-skip = "*"

[tool.cibuildwheel.linux]
before-all = "python3 -m pip install --upgrade pip"
repair-wheel-command = "auditwheel repair --exclude libcudart.so.13 --exclude libcufft.so.12 --exclude libcurand.so.10 -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair --ignore-existing --exclude cudart64_13.dll;cufft64_12.dll;curand64_10.dll;nvJitLink_130_0.dll -w {dest_dir} {wheel}"
