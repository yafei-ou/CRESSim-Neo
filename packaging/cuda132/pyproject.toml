[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "cressim-neo"
version = "0.1.0+cu132"
description = "GPU-accelerated surgical simulation engine with Python bindings (CUDA 13.2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # Match PyTorch cu132's exact CUDA runtime bundle. Its selected extras
    # provide the CUDART, CUFFT, CURAND, and NVJITLINK libraries we preload.
    "cuda-toolkit[cudart,cufft,curand,nvjitlink]==13.2.1; platform_system == 'Linux'",
]

[project.optional-dependencies]
gymnasium = ["gymnasium"]

[tool.scikit-build]
cmake.source-dir = "../.."
cmake.build-type = "Release"
wheel.packages = []
install.components = ["Python"]

[tool.scikit-build.cmake.define]
CRESSIM_NEO_BUILD_PYTHON = true
CRESSIM_NEO_BUILD_VIEWER = true
CRESSIM_NEO_BUILD_EXAMPLES = false
BUILD_TESTING = false
CRESSIM_NEO_ENABLE_CUDA_INTEROP = true
CRESSIM_NEO_ENABLE_ULTRASOUND = true
CRESSIM_NEO_CUDA_RUNTIME_PROVIDER = "MANAGED"
CRESSIM_NEO_MANAGED_CUDA_TOOLKIT_VERSION = "13.2"
CMAKE_CUDA_COMPILER = "/usr/local/cuda-13.2/bin/nvcc"
CMAKE_CUDA_HOST_COMPILER = "/opt/rh/gcc-toolset-13/root/usr/bin/g++"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-skip = "*"
repair-wheel-command = "auditwheel repair --exclude libcudart.so.13 --exclude libcufft.so.12 --exclude libcurand.so.10 -w {dest_dir} {wheel}"

[tool.cibuildwheel.linux]
before-all = "python3 -m pip install --upgrade pip"
