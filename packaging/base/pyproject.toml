[build-system]
requires = ["scikit-build-core>=0.10", "pybind11-stubgen>=2.5"]
build-backend = "scikit_build_core.build"

[project]
name = "cressim-neo"
version = "0.1.0"
description = "GPU-accelerated surgical simulation engine with Python bindings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gymnasium = ["gymnasium"]

[tool.scikit-build]
cmake.source-dir = "../.."
cmake.build-type = "Release"
wheel.packages = []
install.components = ["Python"]

[tool.scikit-build.cmake.define]
CRESSIM_NEO_BUILD_PYTHON = true
CRESSIM_NEO_BUILD_VIEWER = true
CRESSIM_NEO_BUILD_EXAMPLES = false
BUILD_TESTING = false
CRESSIM_NEO_ENABLE_CUDA_INTEROP = false
CRESSIM_NEO_ENABLE_ULTRASOUND = false
CRESSIM_NEO_REQUIRE_PYTHON_STUBS = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-skip = "*"

[tool.cibuildwheel.linux]
before-all = "python3 -m pip install --upgrade pip"
