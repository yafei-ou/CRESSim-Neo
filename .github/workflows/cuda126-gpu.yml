name: CUDA 12.6 GPU integration

on:
  workflow_dispatch:
    inputs:
      cressim_index_url:
        description: CUDA 12.6 CRESSim simple-index URL to test
        required: true
        default: https://yafei-ou.github.io/CRESSim-Neo/whl/cu126

jobs:
  ubuntu-gpu:
    # The runner needs an NVIDIA GPU and Docker configured with the NVIDIA
    # container runtime. Keeping this manual avoids scheduling a GPU job on
    # ordinary GitHub-hosted runners.
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker build -f docker/ubuntu-cu126/Dockerfile -t cressim-neo/ubuntu-cu126:ci .
      - run: >-
          docker run --rm --gpus all
          -e NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
          -e CRESSIM_NEO_CUDA_INDEX_URL='${{ inputs.cressim_index_url }}'
          -v "$PWD:/workspace" -w /workspace
          cressim-neo/ubuntu-cu126:ci
          bash -lc 'scripts/create_cuda126_env.sh ci && micromamba run -n ci python scripts/test_cuda126_interop.py'
