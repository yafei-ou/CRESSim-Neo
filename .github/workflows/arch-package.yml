name: Arch native package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: bash -n packaging/arch/PKGBUILD
      - run: docker build -f docker/arch-package/Dockerfile -t cressim-neo/arch-package:ci .
      - run: >-
          docker run --rm -v "$PWD/packaging/arch:/build" -w /build
          cressim-neo/arch-package:ci
          bash -lc 'chown -R builder:builder /build && su builder -c "cd /build && makepkg --noconfirm --cleanbuild"'
